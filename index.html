
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <style>
    /* Paleta Belah Beauty: cambia estos colores por los de tu marca */
    :root {
      --berry: #8C2150;
      --berry-dark: #6B1A3E;
      --rose: #E8A0B8;
      --blush: #FBE4EB;
      --petal: #FFF6F8;
      --ink: #2E1420;
      --muted: #7A5A68;
      --line: #F0CCD8;
    }

    body {
      font-family: "DM Sans", system-ui, Arial, sans-serif;
      background-color: var(--petal);
      color: var(--ink);
      padding: 20px;
      margin: 0;
      text-align: center;
    }

    h1 {
      font-family: "Bodoni Moda", Georgia, serif;
      font-weight: 500;
      color: var(--berry);
      margin-bottom: 8px;
    }

    .slogan {
      color: var(--muted);
      font-size: 17px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    /* Beneficios de la tienda */

    .beneficios {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;

      background-color: var(--berry);
      color: var(--petal);

      padding: 14px;
      margin-bottom: 30px;
    }

    .beneficios span {
      font-size: 14px;
    }

    /* Catálogo */

    #productos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .producto {
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      padding: 10px;
      width: 220px;
      vertical-align: top;
    }

    .producto img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 4px;
    }

    .producto h3 {
      margin-bottom: 8px;
      color: var(--ink);
    }

    .descripcion {
      font-size: 14px;
      color: var(--muted);
      min-height: 42px;
    }

    .precio {
      font-size: 18px;
      font-weight: bold;
      color: var(--berry);
    }

    /* Botones */

    .producto button {
      background-color: var(--berry);
      border: none;
      color: white;
      padding: 9px 12px;
      margin-top: 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .producto button:hover {
      background-color: var(--berry-dark);
    }

    /* Carrito */

    .carrito {
      margin-top: 35px;
      padding: 20px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: left;
      display: inline-block;
      min-width: 320px;
    }

    .carrito h2 {
      margin-top: 0;
      color: var(--berry);
    }

    #lista-carrito {
      padding-left: 20px;
    }

    #lista-carrito li {
      margin-bottom: 8px;
    }

    .resumen {
      border-top: 1px solid var(--line);
      margin-top: 15px;
      padding-top: 10px;
    }

    .total {
      font-size: 19px;
      color: var(--berry);
    }

    /* Botón vaciar */

    .vaciar {
      background-color: transparent;
      border: 1px solid var(--berry);
      color: var(--berry);
      padding: 9px 12px;
      margin-top: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Botón finalizar */

    .finalizar {
      background-color: var(--ink);
      border: none;
      color: white;
      padding: 9px 12px;
      margin-top: 10px;
      margin-left: 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .vaciar:hover {
      background-color: var(--blush);
    }

    .finalizar:hover {
      background-color: var(--berry);
    }

    button:focus-visible {
      outline: 3px solid var(--rose);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <!DOCTYPE html>
  <html lang="es">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belah Beauty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Cambia estos colores por los de tu marca */
    :root {
      --berry: #8C2150;
      --rose: #E8A0B8;
      --blush: #FBE4EB;
      --petal: #FFF6F8;
      --ink: #2E1420;
      --tono: #8C2150;   /* lo cambia el selector de tonos */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--petal);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      line-height: 1.5;
    }

    /* ===== Hero ===== */

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 40px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 72px 24px;
    }

    .hero-fondo {
      background: color-mix(in srgb, var(--tono) 12%, var(--petal));
      border-bottom: 6px solid var(--berry);
      transition: background .4s ease;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--berry);
      font-weight: 500;
      font-size: .95rem;
    }

    .marca svg { width: 22px; height: 22px; }

    h1 {
      margin: 0 0 16px;
      font-family: "Bodoni Moda", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      line-height: 1.08;
      color: var(--berry);
    }

    .slogan {
      margin: 0 0 28px;
      max-width: 38ch;
      font-size: 1.15rem;
    }

    /* ===== Selector de tonos ===== */

    .tonos {
      border: 0;
      padding: 0;
      margin: 0 0 32px;
    }

    .tonos legend {
      padding: 0;
      margin-bottom: 12px;
      font-size: .95rem;
      font-weight: 500;
    }

    .tonos-fila {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .tono {
      position: relative;
    }

    .tono input {
      position: absolute;
      opacity: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }

    .tono span {
      display: block;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: inset 0 -6px 10px rgba(0,0,0,.18), inset 0 4px 6px rgba(255,255,255,.35);
      outline: 2px solid transparent;
      outline-offset: 3px;
      transition: transform .2s ease, outline-color .2s ease;
    }

    .tono input:hover + span { transform: scale(1.1); }
    .tono input:checked + span { outline-color: var(--ink); }
    .tono input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 4px; }

    #nombre-tono {
      margin: 12px 0 0;
      font-size: .95rem;
      min-height: 1.4em;
    }

    /* ===== Botón ===== */

    .cta {
      display: inline-block;
      padding: 14px 32px;
      background: var(--berry);
      color: var(--petal);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
      transition: background .2s ease, transform .2s ease;
    }

    .cta:hover { background: var(--ink); transform: translateY(-2px); }
    .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    /* ===== Trazo de labial (muestra visual) ===== */

    .muestra {
      position: relative;
      aspect-ratio: 1;
      max-width: 380px;
      width: 100%;
      margin-inline: auto;
    }

    .muestra .disco {
      position: absolute;
      inset: 6%;
      border-radius: 50%;
      background: var(--blush);
      border: 1px solid color-mix(in srgb, var(--tono) 25%, transparent);
    }

    .muestra .trazo {
      position: absolute;
      left: 14%;
      top: 36%;
      width: 72%;
      height: 28%;
      border-radius: 60% 40% 55% 45% / 70% 60% 40% 30%;
      background:
        linear-gradient(105deg, rgba(255,255,255,.45) 0%, transparent 35%),
        var(--tono);
      transform: rotate(-12deg);
      box-shadow: 0 14px 24px color-mix(in srgb, var(--tono) 35%, transparent);
      transition: background-color .4s ease, box-shadow .4s ease;
    }

    .muestra .trazo-2 {
      left: 24%;
      top: 58%;
      width: 52%;
      height: 14%;
      opacity: .6;
      transform: rotate(-8deg);
    }

    /* ===== Celular ===== */

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        padding: 48px 20px;
        text-align: center;
      }
      .marca, .tonos-fila { justify-content: center; }
      .slogan { margin-inline: auto; }
      .muestra { max-width: 240px; order: -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
  </head>
  <body>

  <div class="hero-fondo">
    <header class="hero">
      <div>
        <div class="marca">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="12" width="6" height="10" rx="1" fill="currentColor"/>
            <path d="M9.5 11V6.5C9.5 4 11 2 12 2s2.5 2 2.5 4.5V11z" fill="currentColor" opacity=".7"/>
          </svg>
          Maquillaje
        </div>

        <h1>Belah Beauty</h1>
        <p class="slogan">Maquillaje que realza tu belleza. Tu look perfecto a un clic de distancia.</p>

        <fieldset class="tonos">
          <legend>Elige tu tono</legend>
          <div class="tonos-fila">
            <label class="tono"><input type="radio" name="tono" value="#8C2150" data-nombre="Berry" checked><span style="--c:#8C2150"></span></label>
            <label class="tono"><input type="radio" name="tono" value="#E0587F" data-nombre="Rosa"><span style="--c:#E0587F"></span></label>
            <label class="tono"><input type="radio" name="tono" value="#C98F7F" data-nombre="Nude"><span style="--c:#C98F7F"></span></label>
            <label class="tono"><input type="radio" name="tono" value="#E5614F" data-nombre="Coral"><span style="--c:#E5614F"></span></label>
            <label class="tono"><input type="radio" name="tono" value="#A8667F" data-nombre="Malva"><span style="--c:#A8667F"></span></label>
          </div>
          <p id="nombre-tono" aria-live="polite">Tono: Berry</p>
        </fieldset>

        <a class="cta" href="#productos">Ver productos</a>
      </div>

      <div class="muestra" aria-hidden="true">
        <div class="disco"></div>
        <div class="trazo"></div>
        <div class="trazo trazo-2"></div>
      </div>
    </header>
  </div>

  <script>
    const raiz = document.documentElement;
    const nombre = document.getElementById("nombre-tono");

    document.querySelectorAll('input[name="tono"]').forEach(function (radio) {
      // Nombre accesible para lectores de pantalla
      radio.setAttribute("aria-label", radio.dataset.nombre);

      radio.addEventListener("change", function () {
        raiz.style.setProperty("--tono", radio.value);
        nombre.textContent = "Tono: " + radio.dataset.nombre;
      });
    });
  </script>

  </body>
  </html>

  <div class="beneficios">
    <span>🚚 Envíos en Bogotá</span>
    <span>🔒 Compra segura</span>
    <span>📦 Seguimiento de pedido</span>
  </div>

  <div id="productos"></div>

  <div class="carrito">
    <h2>🧾 Carrito de Compras</h2>

    <ul id="lista-carrito"></ul>

    <div class="resumen">
      <p>
        Envío: <strong>Gratis</strong>
      </p>

      <p class="total">
        Total: $<span id="total">0</span>
      </p>
    </div>

    <button class="vaciar" onclick="vaciarCarrito()">
      🧼 Vaciar Carrito
    </button>

    <button class="finalizar" onclick="finalizarCompra()">
      ✅ Finalizar Compra
    </button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "ULTRA SHINE VOLUMIZING LIP GLOSS",
        descripcion: "Tu nuevo favorito para unos labios con volumen y glow.",
        precio: 25000,
        imagen: "https://belahbeauty.com/cdn/shop/files/guava7.jpg?v=1770677135&width=700"
      },
      {
        id: 2,
        nombre: "METALLIC LONGWEAR CREAM EYESHADOW",
        descripcion: "Una mirada dorada que habla por sí sola.",
        precio: 18000,
        imagen: "https://belahbeauty.com/cdn/shop/files/metallic-longwear-crea-eyeshadow-golden-honey.jpg?v=1763930647&width=700"
      },
      {
        id: 3,
        nombre: "EFFORTLESS DEWY CREAM BLUSH",
        descripcion: "Glow de ensueño en una sola aplicación..",
        precio: 30000,
        imagen: "https://belahbeauty.com/cdn/shop/files/lavender-dewy-cream-blush.jpg?v=1779146597&width=700"
      },
      {
        id: 4,
        nombre: "PEARL-INFUSED LIQUID BLUSH",
        descripcion: "El toque de rosa perfecto para unas mejillas naturalmente irresistibles.",
        precio: 18000,
        imagen: "https://belahbeauty.com/cdn/shop/files/PINKBLUSH.jpg?v=1755984297&width=700"
      },
      {
        id: 5,
        nombre: "DUAL-ENDED BRUSH",
        descripcion: "Precisión en cada pincelada. Perfección en cada look.",
        precio: 22000,
        imagen: "https://belahbeauty.com/cdn/shop/files/belah-brushes-1.jpg?v=1757789760&width=700"
      }
    ];


    /* ==============================
       CARRITO
    ================================ */

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");


    /* ==============================
       MOSTRAR PRODUCTOS
    ================================ */

    function mostrarProductos() {

      contenedorProductos.innerHTML = "";

      productos.forEach(prod => {

        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">

          <h3>${prod.nombre}</h3>

          <p class="descripcion">
            ${prod.descripcion}
          </p>

          <p class="precio">
            ${prod.precio.toLocaleString("es-CO", {
              style: "currency",
              currency: "COP",
              minimumFractionDigits: 0
            })}
          </p>

          <button onclick="agregarAlCarrito(${prod.id})">
            Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);

      });

    }


    /* ==============================
       AGREGAR AL CARRITO
    ================================ */

    function agregarAlCarrito(id) {

      const productoExistente =
        carrito.find(p => p.id === id);

      if (productoExistente) {

        productoExistente.cantidad++;

      } else {

        const producto =
          productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });

      }

      actualizarCarrito();

    }


    /* ==============================
       ACTUALIZAR CARRITO
    ================================ */

    function actualizarCarrito() {

      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {

        const li =
          document.createElement("li");

        const subtotal =
          item.precio * item.cantidad;

        li.textContent =
          `${item.nombre} x${item.cantidad} — ` +
          subtotal.toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            minimumFractionDigits: 0
          });

        listaCarrito.appendChild(li);

        total += subtotal;
        totalItems += item.cantidad;

      });

      totalCarrito.textContent =
        total.toLocaleString("es-CO");

      actualizarTituloCarrito(totalItems);

    }


    /* ==============================
       CONTADOR DEL CARRITO
    ================================ */

    function actualizarTituloCarrito(cantidad) {

      const titulo =
        document.querySelector(".carrito h2");

      titulo.textContent =
        `🧾 Carrito de Compras (${cantidad})`;

    }


    /* ==============================
       VACIAR CARRITO
    ================================ */

    function vaciarCarrito() {

      if (carrito.length === 0) {

        alert("🛒 El carrito ya está vacío.");

        return;

      }

      if (
        confirm(
          "¿Estás seguro de que quieres vaciar el carrito?"
        )
      ) {

        carrito.length = 0;

        actualizarCarrito();

      }

    }


    /* ==============================
       FINALIZAR COMPRA
    ================================ */

    function finalizarCompra() {

      if (carrito.length === 0) {

        alert(
          "🛒 Tu carrito está vacío. Agrega productos antes de finalizar la compra."
        );

        return;

      }

      alert(
        "🎉 ¡Pedido simulado confirmado!\n\n" +
        "En un eCommerce real, ahora entrarían en acción " +
        "el backend, la pasarela de pago y la logística."
      );

      carrito.length = 0;

      actualizarCarrito();

    }


    /* ==============================
       INICIAR TIENDA
    ================================ */

    mostrarProductos();
  </script>
</body>
</html>
