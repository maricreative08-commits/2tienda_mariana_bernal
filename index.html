<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <style>
    /* Paleta Belah Beauty: cambia estos colores por los de tu marca */
    :root {
      --berry: #8C2150;
      --berry-dark: #6B1A3E;
      --rose: #E8A0B8;
      --blush: #FBE4EB;
      --petal: #FFF6F8;
      --ink: #2E1420;
      --muted: #7A5A68;
      --line: #F0CCD8;
    }

    body {
      font-family: "DM Sans", system-ui, Arial, sans-serif;
      background-color: var(--petal);
      color: var(--ink);
      padding: 20px;
      margin: 0;
      text-align: center;
    }

    h1 {
      font-family: "Bodoni Moda", Georgia, serif;
      font-weight: 500;
      color: var(--berry);
      margin-bottom: 8px;
    }

    .slogan {
      color: var(--muted);
      font-size: 17px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    /* Beneficios de la tienda */

    .beneficios {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;

      background-color: var(--berry);
      color: var(--petal);

      padding: 14px;
      margin-bottom: 30px;
    }

    .beneficios span {
      font-size: 14px;
    }

    /* Catálogo */

    #productos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .producto {
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      padding: 10px;
      width: 220px;
      vertical-align: top;
    }

    .producto img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 4px;
    }

    .producto h3 {
      margin-bottom: 8px;
      color: var(--ink);
    }

    .descripcion {
      font-size: 14px;
      color: var(--muted);
      min-height: 42px;
    }

    .precio {
      font-size: 18px;
      font-weight: bold;
      color: var(--berry);
    }

    /* Botones */

    .producto button {
      background-color: var(--berry);
      border: none;
      color: white;
      padding: 9px 12px;
      margin-top: 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .producto button:hover {
      background-color: var(--berry-dark);
    }

    /* Carrito */

    .carrito {
      margin-top: 35px;
      padding: 20px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: left;
      display: inline-block;
      min-width: 320px;
    }

    .carrito h2 {
      margin-top: 0;
      color: var(--berry);
    }

    #lista-carrito {
      padding-left: 20px;
    }

    #lista-carrito li {
      margin-bottom: 8px;
    }

    .resumen {
      border-top: 1px solid var(--line);
      margin-top: 15px;
      padding-top: 10px;
    }

    .total {
      font-size: 19px;
      color: var(--berry);
    }

    /* Botón vaciar */

    .vaciar {
      background-color: transparent;
      border: 1px solid var(--berry);
      color: var(--berry);
      padding: 9px 12px;
      margin-top: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Botón finalizar */

    .finalizar {
      background-color: var(--ink);
      border: none;
      color: white;
      padding: 9px 12px;
      margin-top: 10px;
      margin-left: 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .vaciar:hover {
      background-color: var(--blush);
    }

    .finalizar:hover {
      background-color: var(--berry);
    }

    button:focus-visible {
      outline: 3px solid var(--rose);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <!DOCTYPE html>
  <html lang="es">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belah Beauty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Cambia estos colores por los de tu marca */
    :root {
      --berry: #8C2150;
      --rose: #E8A0B8;
      --blush: #FBE4EB;
      --petal: #FFF6F8;
      --ink: #2E1420;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--petal);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
    }

    .hero {
      background: var(--blush);
      padding: 72px 24px 64px;
      text-align: center;
      border-bottom: 6px solid var(--berry);
    }

    h1 {
      margin: 0 0 16px;
      font-family: "Bodoni Moda", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: 1.1;
      color: var(--berry);
    }

    .slogan {
      margin: 0 auto 32px;
      max-width: 36ch;
      font-size: 1.15rem;
      line-height: 1.5;
    }

    .cta {
      display: inline-block;
      padding: 14px 32px;
      background: var(--berry);
      color: var(--petal);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
    }

    .cta:hover { background: var(--ink); }
    .cta:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
  </style>
  </head>
  <body>

  <header class="hero">
    <h1>💄 Belah Beauty</h1>
    <p class="slogan">Maquillaje que realza tu belleza. Tu look perfecto a un clic de distancia ✨</p>
    <a class="cta" href="#productos">Ver productos</a>
  </header>

  </body>
  </html>

  <div class="beneficios">
    <span>🚚 Envíos en Bogotá</span>
    <span>🔒 Compra segura</span>
    <span>📦 Seguimiento de pedido</span>
  </div>

  <div id="productos"></div>

  <div class="carrito">
    <h2>🧾 Carrito de Compras</h2>

    <ul id="lista-carrito"></ul>

    <div class="resumen">
      <p>
        Envío: <strong>Gratis</strong>
      </p>

      <p class="total">
        Total: $<span id="total">0</span>
      </p>
    </div>

    <button class="vaciar" onclick="vaciarCarrito()">
      🧼 Vaciar Carrito
    </button>

    <button class="finalizar" onclick="finalizarCompra()">
      ✅ Finalizar Compra
    </button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "ULTRA SHINE VOLUMIZING LIP GLOSS",
        descripcion: "Tu nuevo favorito para unos labios con volumen y glow.",
        precio: 25000,
        imagen: "https://belahbeauty.com/cdn/shop/files/guava7.jpg?v=1770677135&width=700"
      },
      {
        id: 2,
        nombre: "METALLIC LONGWEAR CREAM EYESHADOW",
        descripcion: "Una mirada dorada que habla por sí sola.",
        precio: 18000,
        imagen: "https://belahbeauty.com/cdn/shop/files/metallic-longwear-crea-eyeshadow-golden-honey.jpg?v=1763930647&width=700"
      },
      {
        id: 3,
        nombre: "EFFORTLESS DEWY CREAM BLUSH",
        descripcion: "Glow de ensueño en una sola aplicación..",
        precio: 30000,
        imagen: "https://belahbeauty.com/cdn/shop/files/lavender-dewy-cream-blush.jpg?v=1779146597&width=700"
      },
      {
        id: 4,
        nombre: "PEARL-INFUSED LIQUID BLUSH",
        descripcion: "El toque de rosa perfecto para unas mejillas naturalmente irresistibles.",
        precio: 18000,
        imagen: "https://belahbeauty.com/cdn/shop/files/PINKBLUSH.jpg?v=1755984297&width=700"
      },
      {
        id: 5,
        nombre: "DUAL-ENDED BRUSH",
        descripcion: "Precisión en cada pincelada. Perfección en cada look.",
        precio: 22000,
        imagen: "https://belahbeauty.com/cdn/shop/files/belah-brushes-1.jpg?v=1757789760&width=700"
      }
    ];


    /* ==============================
       CARRITO
    ================================ */

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");


    /* ==============================
       MOSTRAR PRODUCTOS
    ================================ */

    function mostrarProductos() {

      contenedorProductos.innerHTML = "";

      productos.forEach(prod => {

        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">

          <h3>${prod.nombre}</h3>

          <p class="descripcion">
            ${prod.descripcion}
          </p>

          <p class="precio">
            ${prod.precio.toLocaleString("es-CO", {
              style: "currency",
              currency: "COP",
              minimumFractionDigits: 0
            })}
          </p>

          <button onclick="agregarAlCarrito(${prod.id})">
            Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);

      });

    }


    /* ==============================
       AGREGAR AL CARRITO
    ================================ */

    function agregarAlCarrito(id) {

      const productoExistente =
        carrito.find(p => p.id === id);

      if (productoExistente) {

        productoExistente.cantidad++;

      } else {

        const producto =
          productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });

      }

      actualizarCarrito();

    }


    /* ==============================
       ACTUALIZAR CARRITO
    ================================ */

    function actualizarCarrito() {

      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {

        const li =
          document.createElement("li");

        const subtotal =
          item.precio * item.cantidad;

        li.textContent =
          `${item.nombre} x${item.cantidad} — ` +
          subtotal.toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            minimumFractionDigits: 0
          });

        listaCarrito.appendChild(li);

        total += subtotal;
        totalItems += item.cantidad;

      });

      totalCarrito.textContent =
        total.toLocaleString("es-CO");

      actualizarTituloCarrito(totalItems);

    }


    /* ==============================
       CONTADOR DEL CARRITO
    ================================ */

    function actualizarTituloCarrito(cantidad) {

      const titulo =
        document.querySelector(".carrito h2");

      titulo.textContent =
        `🧾 Carrito de Compras (${cantidad})`;

    }


    /* ==============================
       VACIAR CARRITO
    ================================ */

    function vaciarCarrito() {

      if (carrito.length === 0) {

        alert("🛒 El carrito ya está vacío.");

        return;

      }

      if (
        confirm(
          "¿Estás seguro de que quieres vaciar el carrito?"
        )
      ) {

        carrito.length = 0;

        actualizarCarrito();

      }

    }


    /* ==============================
       FINALIZAR COMPRA
    ================================ */

    function finalizarCompra() {

      if (carrito.length === 0) {

        alert(
          "🛒 Tu carrito está vacío. Agrega productos antes de finalizar la compra."
        );

        return;

      }

      alert(
        "🎉 ¡Pedido simulado confirmado!\n\n" +
        "En un eCommerce real, ahora entrarían en acción " +
        "el backend, la pasarela de pago y la logística."
      );

      carrito.length = 0;

      actualizarCarrito();

    }


    /* ==============================
       INICIAR TIENDA
    ================================ */

    mostrarProductos();
  </script>
</body>
</html>
